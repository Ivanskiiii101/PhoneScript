# App list for provision.sh
# Format:  Name | package id | source | argument
#
# Sources:
#   fdroid  - latest APK from f-droid.org (no argument)
#   github  - latest GitHub release: "owner/repo REGEX" (regex matches the .apk file name)
#   json    - "URL JQ_PATH" pointing to a JSON file that contains the APK link
#   url     - direct link to the APK
#   aurora  - open the app in Aurora Store and wait for the technician to tap Install
#
# If a download fails, the script automatically falls back to Aurora Store.
# With --aurora-only, every app goes through Aurora regardless of the source.
# Lines starting with # are ignored.

Signal             | org.thoughtcrime.securesms | json   | https://updates.signal.org/android/latest.json .url
WhatsApp           | com.whatsapp               | url    | https://www.whatsapp.com/android/current/WhatsApp.apk
Telegram           | org.telegram.messenger     | aurora |
SimpleX Chat       | chat.simplex.app           | github | simplex-chat/simplex-chat aarch64.*\.apk$
Session            | network.loki.messenger     | github | session-foundation/session-android universal.*\.apk$
Mullvad VPN        | net.mullvad.mullvadvpn     | fdroid |
Wasted             | me.lucky.wasted            | fdroid |
Molly              | im.molly.app               | github | mollyim/mollyim-android ^Molly-v[^F]*\.apk$
Snapchat           | com.snapchat.android       | aurora |
Threema            | ch.threema.app             | aurora |

